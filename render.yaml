services:
  - type: web
    name: superjoin-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: LLM_PROVIDER
        value: "gemini"
      - key: GEMINI_API_KEY
        sync: false # Requires manual entry in the dashboard
      - key: PYTHONPATH
        value: "."
      
  - type: web
    name: superjoin-frontend
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: superjoin-backend
          envVar: RENDER_EXTERNAL_URL
